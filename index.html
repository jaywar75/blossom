<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blossom App</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      padding-top: 56px;
    }
  </style>
</head>
<body>
<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Blossom App</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link active" href="#home">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#about">About</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#contact">Contact</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Main Container -->
<div class="container mt-5">
  <!-- Home Section -->
  <section id="home">
    <h2 class="mb-4">Tenant Onboarding</h2>
    <form id="tenantForm">
      <div class="row mb-3">
        <div class="col-md-6">
          <label for="tenantId" class="form-label">Tenant ID</label>
          <input type="text" class="form-control" id="tenantId" placeholder="Enter Tenant ID">
        </div>
        <div class="col-md-6">
          <label for="tenantName" class="form-label">Tenant Name</label>
          <input type="text" class="form-control" id="tenantName" placeholder="Enter Tenant Name">
        </div>
      </div>
      <div class="mb-3">
        <label for="adminEmail" class="form-label">Admin Email</label>
        <input type="email" class="form-control" id="adminEmail" placeholder="Enter Admin Email">
      </div>
      <div class="row mb-3">
        <div class="col-md-4">
          <label for="field4" class="form-label">Field 4</label>
          <input type="text" class="form-control" id="field4" placeholder="Field 4">
        </div>
        <div class="col-md-4">
          <label for="field5" class="form-label">Field 5</label>
          <input type="text" class="form-control" id="field5" placeholder="Field 5">
        </div>
        <div class="col-md-4">
          <label for="field6" class="form-label">Field 6</label>
          <input type="text" class="form-control" id="field6" placeholder="Field 6">
        </div>
      </div>
      <div class="mb-3">
        <label for="field7" class="form-label">Field 7</label>
        <input type="text" class="form-control" id="field7" placeholder="Field 7">
      </div>
      <button type="submit" class="btn btn-success">Submit</button>
    </form>
  </section>

  <!-- About Section -->
  <section id="about" class="mt-5">
    <h2>About</h2>
    <p>This is a demonstration of a robust UI using TypeScript and Bootstrap for a professional SPA.</p>
  </section>

  <!-- Contact Section -->
  <section id="contact" class="mt-5">
    <h2>Contact</h2>
    <p>Contact details would go here.</p>
  </section>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Compiled TypeScript Code -->
<script src="dist/index.js"></script>
</body>
</html>
